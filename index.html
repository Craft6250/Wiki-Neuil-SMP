<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wiki</title>
<style>
:root{--bg:#f7f8f6;--fg:#1c2530;--mut:#66727f;--bd:#dde2e0;--ac:#0f766e;--sf:#eef1ef;--er:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#12171b;--fg:#e4e9e7;--mut:#93a09b;--bd:#27302f;--ac:#4fc3b4;--sf:#1a2125;--er:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
header b{font-size:17px}
#q{flex:1;max-width:360px;margin-left:auto}
#tools{display:flex;gap:8px;align-items:center}
input,textarea,select,button{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
button{cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#layout{display:flex;min-height:calc(100vh - 56px)}
nav{width:240px;padding:16px;border-right:1px solid var(--bd);flex:none}
nav h4{margin:14px 0 4px;font-size:13px;color:var(--mut);font-weight:600}
nav a{display:block;padding:3px 8px;border-radius:5px;color:var(--fg);text-decoration:none}
nav a:hover,nav a.on{background:var(--sf);color:var(--ac)}
main{flex:1;padding:24px 32px;max-width:1000px;min-width:0}
main.wide{max-width:none}
a{color:var(--ac)}a.missing{color:var(--er)}
.desc{color:var(--mut);margin-top:-8px}
.box{float:right;width:270px;margin:0 0 16px 24px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);overflow:hidden}
.box h3{margin:0;padding:8px 12px;text-align:center;border-bottom:1px solid var(--bd)}
.box img{display:block;max-width:100%;margin:12px auto}
.box table{border:0;width:100%}
.box th,.box td{border:0;border-top:1px solid var(--bd);padding:6px 12px;text-align:left;vertical-align:top}
.box th{width:42%}
table{border-collapse:collapse}
td,th{border:1px solid var(--bd);padding:6px 10px}
blockquote{margin:0;padding:4px 14px;border-left:3px solid var(--ac);color:var(--mut)}
code{background:var(--sf);padding:1px 5px;border-radius:4px}
img{max-width:100%}
details{margin-top:24px;clear:both}
summary{cursor:pointer;font-size:1.2em;font-weight:600}
.hist{margin:8px 0;padding-left:12px;border-left:2px solid var(--bd)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cards a{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;text-decoration:none;color:var(--fg);background:var(--sf)}
.cards small{display:block;color:var(--mut)}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ed label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
.ed input:not([type=file]),.ed textarea,.ed select{width:100%}
.ed textarea{font:13px/1.5 ui-monospace,Consolas,monospace}
.pv{border:1px solid var(--bd);border-radius:8px;padding:16px;overflow:auto;max-height:80vh}
#msg{margin-left:8px;color:var(--ac)}
@media(max-width:860px){#layout,.ed{display:block}nav{width:auto;border:0}.box{float:none;width:auto;margin:0 0 16px}main{padding:16px}}
#ed.ed1{margin-top:4px}
.tb{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.tb button,.tb select{padding:3px 9px}
.last{color:var(--mut);font-size:13px;margin-top:-8px}

.map-box{margin:16px 0;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.map-legend{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--sf);border-bottom:1px solid var(--bd)}
.map-legend button{display:flex;gap:6px;align-items:center;border-left:4px solid var(--mc);padding:3px 10px}
.map-legend img{width:16px;height:16px;object-fit:contain}.map-legend .off{opacity:.4}
.map-inner{position:relative;line-height:0;touch-action:none}.map-inner>img{width:100%;display:block}
.map-overlay{position:absolute;inset:0}
.map-marker{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:var(--mc);box-shadow:0 0 10px var(--mg);display:flex;align-items:center;justify-content:center;line-height:1;cursor:pointer;text-decoration:none}
.map-marker[hidden]{display:none}
.map-marker img{width:68%;height:68%;object-fit:contain}
.map-marker i{display:none;position:absolute;bottom:125%;white-space:nowrap;background:#000c;color:#fff;padding:2px 8px;border-radius:5px;font:12px/1.4 system-ui;font-style:normal;pointer-events:none}
.map-marker:hover{z-index:4}.map-marker:hover i{display:block}.map-marker.sel{outline:2px solid #fff;z-index:3}
.lgrid{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:16px;margin:16px 0}
.lcard{position:relative;display:block;aspect-ratio:16/9;border-radius:10px;overflow:hidden;color:#fff;background:#222;text-decoration:none}
.lcard.wide{grid-column:1/-1;aspect-ratio:21/6}
.lcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s}.lcard:hover img{transform:scale(1.04)}
.lg{position:absolute;inset:0;background:linear-gradient(transparent 40%,#000d)}
.lc{position:absolute;left:0;right:0;bottom:0;padding:12px 14px;line-height:1.3}.lt{font-weight:700;font-size:1.1em}.ld{font-size:13px;opacity:.85}
.ltag{position:absolute;top:10px;right:10px;background:var(--ac);color:#fff;padding:2px 8px;border-radius:5px;font-size:12px;font-weight:600}
.trow,.crow{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:4px 0}
.ed .trow input,.ed .crow input{width:auto!important}.ed .crow input:not([type=checkbox]){flex:1 1 110px;min-width:0}
.trow input[type=color]{padding:0;width:34px!important;height:28px}
@media(max-width:600px){.lgrid{grid-template-columns:1fr}}
.hero-banner{position:relative;display:flex;align-items:flex-end;min-height:260px;margin:16px 0;border-radius:12px;overflow:hidden;background:linear-gradient(transparent 30%,#000b),var(--hero-img,none) center/cover,#222;color:#fff}
.hero-content{padding:32px}
.hero-title{margin:0 0 4px;font-size:2.2em;color:#fff}
.hero-subtitle{margin:0 0 16px;opacity:.9}
.hero-btn{display:inline-flex;gap:8px;align-items:center;background:var(--ac);color:#fff;padding:8px 16px;border-radius:8px;text-decoration:none;font-weight:600}
.hero-btn:hover{filter:brightness(1.1)}
.back{display:inline-flex;align-items:center;gap:10px;margin-bottom:12px;padding:6px 14px 6px 6px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--fg);text-decoration:none}
.back:hover{border-color:var(--ac)}
.back img{width:40px;height:40px;object-fit:cover;border-radius:8px}
.back .ar{width:40px;text-align:center;font-size:20px;color:var(--mut)}
.back b{display:block;line-height:1.2}.back small{color:var(--mut)}
.crow>input:not([type=checkbox]),.crow>select{flex:1 1 140px;min-width:0}
.ed input[type=checkbox]{width:auto!important}
#side{display:none;flex:none;width:236px;padding:16px 0 16px 16px;align-self:flex-start}
#side:empty{display:none!important}
@media(min-width:1000px){#side{display:block;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}.last{display:none}}
.sd-box{background:var(--sf);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.sd-box h5{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
.sd{display:block;padding:4px 0 4px 8px;color:var(--fg);font-weight:600;font-size:14px;cursor:pointer;border-left:2px solid transparent}
.sd.l1,.sd.l2,.sd.l3{font-weight:400;color:var(--mut);font-size:13px}
.sd.l1{padding-left:22px}.sd.l2{padding-left:34px}.sd.l3{padding-left:46px}
.sd:hover,.sd.on{color:var(--ac);border-left-color:var(--ac)}
.sd-au{font-size:16px;font-weight:600}.sd-box small{color:var(--mut)}
main h1,main h2,main h3,main h4{scroll-margin-top:70px}
header{flex-wrap:wrap}
#site{font-size:17px;font-weight:700;color:var(--fg);text-decoration:none}
#links{display:flex;gap:2px;flex-wrap:wrap}
#links a{padding:4px 10px;border-radius:6px;color:var(--fg);text-decoration:none;white-space:nowrap}
#links a:hover,#links a.on{background:var(--sf);color:var(--ac)}
</style>
<style id="custom"></style>
</head>
<body>
<header>
  <a id="site" href="#/">Wiki</a>
  <span id="links"></span>
  <span id="tools" hidden><button id="open">📁 Ouvrir le dossier</button><a href="#/edit">✎ Éditeur</a></span>
  <input id="q" type="search" placeholder="Rechercher une page…">
</header>
<div id="layout"><aside id="side"></aside><main id="main"></main></div>
<script>
const $=s=>document.querySelector(s), main=$('#main');
const LOCAL=location.protocol==='file:'||['localhost','127.0.0.1'].includes(location.hostname);
const CLEAN=!LOCAL&&/^https?:$/.test(location.protocol);
const BASE=CLEAN?'/':'';
const curPath=()=>CLEAN?decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,'').replace(/^index\.html$/,'')):location.hash.slice(2);
function fixLinks(root){if(CLEAN)root.querySelectorAll('a[href^="#/"]').forEach(a=>a.setAttribute('href',a.getAttribute('href').slice(1)))}
const S={dir:null,ok:false,m:{name:'Mon Wiki',pages:[],templates:[]},cache:{},tpl:{},map:{},grid:{},tab:'page'};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const rel=(u,c)=>/^(https?:|\/)/.test(u)?u:c+'/'+u;
const find=k=>S.m.pages.find(p=>p.path===k)||S.m.pages.find(p=>p.path===k.toLowerCase())||S.m.pages.find(p=>p.title.toLowerCase()===k.toLowerCase());

/* ---------- Fichiers : dossier local ou fetch (GitHub Pages) ---------- */
async function getDir(path,create){let d=S.dir;const a=path.split('/');for(const p of a.slice(0,-1))d=await d.getDirectoryHandle(p,{create});return [d,a.at(-1)]}
async function readText(p){
  if(S.dir){const [d,n]=await getDir(p);return (await (await d.getFileHandle(n)).getFile()).text()}
  const r=await fetch(BASE+p+'?t='+Date.now());if(!r.ok||(/text\/html/.test(r.headers.get('content-type')||'')&&!/\.html?$/.test(p)))throw 0;return r.text()}
async function writeFile(p,data){const [d,n]=await getDir(p,true);const w=await (await d.getFileHandle(n,{create:true})).createWritable();await w.write(data);await w.close()}
async function fileURL(p){const [d,n]=await getDir(p);return URL.createObjectURL(await (await d.getFileHandle(n)).getFile())}
async function fixImgs(root){
  for(const im of root.querySelectorAll('img[data-src]')){
    const p=im.dataset.src;im.referrerPolicy='no-referrer';
    try{im.src=(/^https?:/.test(p)||!S.dir)?(/^https?:/.test(p)?p:BASE+p.replace(/^\//,'')):await fileURL(p)}catch{im.alt=im.alt||'Image introuvable : '+p}}}

/* ---------- Page = front matter + Markdown ---------- */
function parse(t){
  const meta={title:'',description:'',category:'',image:'',edited:'',author:'',back:'',infobox:[],history:[]};
  const m=t.replace(/\r/g,'').match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if(!m)return {meta,body:t};
  let sec=null;
  for(const l of m[1].split('\n')){
    const s=l.match(/^(infobox|history):\s*$/);if(s){sec=s[1];continue}
    const it=l.match(/^  - ([^:]+):\s?(.*)$/);if(sec&&it){meta[sec].push([it[1].trim(),it[2]]);continue}
    const kv=l.match(/^(\w+):\s?(.*)$/);if(kv){sec=null;meta[kv[1]]=kv[2]}}
  return {meta,body:m[2]}}
function dump(m,body){
  let y=`---\ntitle: ${m.title}\ndescription: ${m.description}\ncategory: ${m.category}\nimage: ${m.image}\nedited: ${m.edited||''}\nauthor: ${m.author||''}\nback: ${m.back||''}\n`;
  for(const k of ['infobox','history']){y+=k+':\n';for(const [a,b] of m[k])y+=`  - ${a}: ${b}\n`}
  return y+'---\n'+body}

/* ---------- Mini Markdown ---------- */
const OKT=new Set('span div b i u s em strong small big sub sup br hr mark center p a img table thead tbody tr td th ul ol li details summary code pre blockquote h1 h2 h3 h4 h5 h6 kbd abbr section article header footer aside nav figure figcaption dl dt dd'.split(' '));
const OKA=new Set('class style id href src title width height colspan rowspan align target rel alt open'.split(' '));
function safeTags(s,cat){
  return s.replace(/&lt;(\/?)([a-z][a-z0-9]*)((?:\s+[\w-]+(?:\s*=\s*(?:"[^"<>]*"|'[^'<>]*'))?)*)\s*\/?&gt;/gi,(m,c,t,a)=>{
    t=t.toLowerCase();if(!OKT.has(t))return m;if(c)return `</${t}>`;
    let o='';
    a.replace(/([\w-]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'))?/g,(_,n,v1,v2)=>{
      n=n.toLowerCase();let v=v1??v2??'';
      if(!OKA.has(n)||/javascript:|expression\(|^\s*data:/i.test(v))return;
      if(t==='img'&&n==='src'){n='data-src';v=rel(v,cat)}
      else if(t==='a'&&n==='href'&&!/^(https?:|#|mailto:)/.test(v))v=lnk(v);
      o+=` ${n}="${v.replace(/"/g,'&quot;')}"`});
    if(t==='a'&&/target="_blank"/.test(o))o+=' rel="noopener"';
    return `<${t}${o}>`})}
function inline(s,cat){
  const cs=[];s=esc(s).replace(/`([^`]+)`/g,(_,c)=>'\u0002'+(cs.push(c)-1)+'\u0002');s=safeTags(s,cat);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s|]+)(?:\|(\d+)(?:x(\d+))?)?\)/g,(_,a,u,w,h)=>`<img alt="${a}" data-src="${rel(u,cat)}"${w?` width="${w}"`:''}${h?` height="${h}"`:''}>`);
  s=s.replace(/\[([^\]]+)\]\{\.([\w-]+)\}/g,'<span class="$2">$1</span>');
  s=s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(_,t,l)=>{const p=find(t.trim());return p?`<a href="#/${p.path}">${l||p.title}</a>`:`<a class="missing" title="Page introuvable">${l||t}</a>`});
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(_,l,u)=>/^https?:/.test(u)?`<a href="${u}" target="_blank" rel="noopener">${l}</a>`:`<a href="${u}">${l}</a>`);
  return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\u0002(\d+)\u0002/g,(_,n)=>`<code>${cs[n]}</code>`)}
function mdb(src,cat){
  const L=src.replace(/\r/g,'').split('\n'),cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  const UL=/^\s*[-*]\s/,OL=/^\s*\d+\.\s/;let h='',i=0,m;
  while(i<L.length){const l=L[i];
    if(!l.trim()){i++;continue}
    if(m=l.match(/^(#{1,4})\s+(.*)/)){h+=`<h${m[1].length}>${inline(m[2],cat)}</h${m[1].length}>`;i++;continue}
    if(/^---+$/.test(l)){h+='<hr>';i++;continue}
    if(/^\s*<(div|section|article|header|footer|aside|nav|figure|table|center|details|ul|ol|dl|blockquote|pre|h[1-6]|p)[\s>]/i.test(l)){const b=[];while(i<L.length&&L[i].trim())b.push(L[i++]);h+=inline(b.join('\n'),cat);continue}
    if(m=l.match(/^:::\s*([\w -]+?)\s*$/)){let dep=1;const b=[];i++;
      while(i<L.length){if(/^:::\s*\S/.test(L[i]))dep++;else if(/^:::\s*$/.test(L[i])&&!--dep)break;b.push(L[i++])}
      i++;h+=`<div class="${m[1]}">${mdb(b.join('\n'),cat)}</div>`;continue}
    if(UL.test(l)||OL.test(l)){const t=UL.test(l)?'ul':'ol',re=t=='ul'?UL:OL;h+=`<${t}>`;while(i<L.length&&re.test(L[i]))h+=`<li>${inline(L[i++].replace(re,''),cat)}</li>`;h+=`</${t}>`;continue}
    if(l.startsWith('>')){const b=[];while(i<L.length&&L[i].startsWith('>'))b.push(L[i++].replace(/^>\s?/,''));h+=`<blockquote>${inline(b.join(' '),cat)}</blockquote>`;continue}
    if(l.includes('|')&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(L[i+1]||'')){
      let t='<table><thead><tr>'+cells(l).map(c=>`<th>${inline(c,cat)}</th>`).join('')+'</tr></thead><tbody>';i+=2;
      while(i<L.length&&L[i].includes('|'))t+='<tr>'+cells(L[i++]).map(c=>`<td>${inline(c,cat)}</td>`).join('')+'</tr>';
      h+=t+'</tbody></table>';continue}
    const p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|---+$|>|:::|<(div|section|article|header|footer|aside|nav|figure|table|center|details|ul|ol|dl|blockquote|pre|h[1-6])[\s>])/i.test(L[i])&&!UL.test(L[i])&&!OL.test(L[i]))p.push(L[i++]);
    if(!p.length)p.push(L[i++]);
    h+=`<p>${inline(p.join(' '),cat)}</p>`}
  return h}

/* ---------- Modèles {{Nom|param=valeur}} ---------- */
let curCat='';
function splitArgs(s){
  const out=[];let cur='',dep=0;
  for(let i=0;i<s.length;i++){const two=s.substr(i,2);
    if(two==='[['||two==='{{'){dep++;cur+=two;i++}
    else if(two===']]'||two==='}}'){dep--;cur+=two;i++}
    else if(s[i]==='|'&&dep<=0){out.push(cur);cur=''}
    else cur+=s[i]}
  out.push(cur);return out}
function expandT(s,d,store){
  if(d>4)return s;
  let out='',i=0;
  while(i<s.length){
    if(s.startsWith('{{',i)&&s[i+2]!=='{'){
      let dep=0,j=i;
      for(;j<s.length;j++){if(s.startsWith('{{',j)){dep++;j++}else if(s.startsWith('}}',j)){dep--;j++;if(!dep)break}}
      if(dep===0&&j<s.length){
        const a=splitArgs(s.slice(i+2,j-1)),t=S.tpl[slug(a[0])];
        if(t!==undefined){
          const P={};let n=1;
          a.slice(1).forEach(x=>{const e=x.match(/^\s*([\p{L}\d_][\p{L}\d_ -]*?)\s*=([\s\S]*)$/u);e?P[e[1].trim()]=e[2].trim():P[n++]=x.trim()});
          let h=t.replace(/\{\{\{([^|}]+)(?:\|([^}]*))?\}\}\}/g,(_,k,df)=>{k=k.trim();return inline(k in P?P[k]:(df??''),curCat)});
          h=expandT(h,d+1,store);
          out+=d?h:'\u0001'+(store.push(h.replace(/data-img="([^"]*)"/g,(_,u)=>u?`data-src="${rel(u,curCat)}"`:'hidden'))-1)+'\u0001';
          i=j+1;continue}}}
    out+=s[i++]}
  return out}
function md(src,cat){
  curCat=cat;const store=[];
  src=src.replace(/^```html\n([\s\S]*?)\n```[ \t]*$/gm,(_,h)=>'\u0001'+(store.push(h)-1)+'\u0001');
  src=src.replace(/^\[(map|cards):\s*([^\]\n]+?)\s*\][ \t]*$/gm,(a,k,n)=>{const h=k==='map'?mapHTML(S.map[slug(n)]):cardsHTML(S.grid[slug(n)]);return h?'\u0001'+(store.push(h)-1)+'\u0001':a});
  const h=mdb(expandT(src,0,store),cat);
  return h.replace(/<p>\u0001(\d+)\u0001<\/p>/g,(_,n)=>store[n]).replace(/\u0001(\d+)\u0001/g,(_,n)=>store[n])}

/* ---------- Affichage ---------- */
const fmt=d=>{const x=new Date(d);return isNaN(x)?d:x.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})+' à '+x.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})};
const backCfg=()=>({on:true,text:'Retour à l’accueil',sub:'',image:'',target:S.m.back||'home',...S.m.backBar});
function backBar(c,meta){
  if(!c.on)return '';
  const b=meta.back||c.target||'home';if(b==='none')return '';
  const p=b==='home'?null:find(b);if(b!=='home'&&!p)return '';
  if(p?p.path===meta.__path:(S.m.home&&S.m.home===meta.__path))return '';
  const text=b===c.target||!p?c.text:'Retour : '+p.title;
  return `<a class="back" href="#/${p?p.path:''}">${c.image?`<img data-src="${qa(c.image)}" alt="">`:'<span class="ar">←</span>'}<span><b>${esc(text)}</b>${b===c.target&&c.sub?`<small>${esc(c.sub)}</small>`:''}</span></a>`}
const backHTML=meta=>backBar(backCfg(),meta);
function article(meta,body){
  const c=meta.category;
  const rows=meta.infobox.map(([a,b])=>`<tr><th>${esc(a)}</th><td>${inline(b,c)}</td></tr>`).join('');
  const box=(meta.image||rows)?`<aside class="box"><h3>${esc(meta.title)}</h3>${meta.image?`<img data-src="${rel(meta.image,c)}" alt="">`:''}<table>${rows}</table></aside>`:'';
  const hist=meta.history.length?`<details open><summary>Historique des mises à jour</summary>${meta.history.map(([a,b])=>`<div class="hist"><b>${esc(a)}</b> ${inline(b,c)}</div>`).join('')}</details>`:'';

const unlines=t=>t.split('\n').map(l=>{const i=l.indexOf(':');return i>0?[l.slice(0,i).trim(),l.slice(i+1).trim()]:null}).filter(Boolean);

const wrap=(ta,a,b='')=>{const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;ta.value=v.slice(0,s)+a+v.slice(s,e)+b+v.slice(e);ta.focus();ta.selectionStart=s+a.length;ta.selectionEnd=e+a.length;ta.dispatchEvent(new Event('input'))};

 'Note':'<div class="note {{{type|}}}"><b>{{{titre|Note}}}</b><br>{{{1|}}}</div>',

    say('Enregistré ✓')};
  f('del').onclick=async()=>{if(cur&&await delPage(cur))pageTab()};

  if(sel){f('ts').value=sel;fill(sel)}else prev()}

async function cssTab(){
  $('#ed').innerHTML=`<label>style.css — appliqué à tout le wiki, l’aperçu est immédiat</label><textarea id="cs" rows="24" style="width:100%;font:13px/1.5 ui-monospace,Consolas,monospace"></textarea>
  <p><button class="pri" id="csv">Enregistrer style.css</button><span id="msg"></span></p>`;
  $('#cs').value=$('#custom').textContent||STARTER_CSS;
  $('#cs').oninput=e=>{$('#custom').textContent=e.target.value};
  $('#csv').onclick=async()=>{await writeFile('style.css',$('#cs').value);say('Enregistré ✓')}}

/* ---------- Cartes interactives & grilles de cartes ---------- */
const qa=s=>esc(String(s??'')).replace(/"/g,'&quot;');
const stripSlash=l=>(l||'').replace(/^\//,'');
const bn=u=>(u||'').split('/').pop().split('?')[0];
const lnk=l=>/^https?:/.test(l)?l:(!l||l==='home'||l==='/')?'#/':'#/'+((find(stripSlash(l))||{}).path||stripSlash(l).toLowerCase());
const ha=l=>l?`href="${qa(lnk(l))}"${/^https?:/.test(l)?' target="_blank" rel="noopener"':''}`:'';
const icon=t=>t.icon?`<img data-src="${qa(t.icon)}" alt="">`:'';
function mapHTML(d){
  if(!d)return '';
  const T=Object.fromEntries((d.types||[]).map(t=>[t.id,t]));
  const lg=(d.types||[]).map(t=>`<button data-t="${qa(t.id)}" style="--mc:${qa(t.color)}">${icon(t)}${esc(t.label)}</button>`).join('');
  const mk=(d.markers||[]).map(m=>{const t=T[m.t]||{},c=t.color||'#888',lk=m.link||t.link;
    return `<${lk?'a':'span'} class="map-marker" data-t="${qa(m.t)}" ${ha(lk)} style="top:${m.y}%;left:${m.x}%;--mc:${c};--mg:${c}b3;width:${d.size||26}px;height:${d.size||26}px">${icon(t)}<i>${esc(m.label||t.label||'')}</i></${lk?'a':'span'}>`}).join('');
  return `<div class="map-box"><div class="map-legend">${lg}</div><div class="map-inner"><img class="map-image" data-src="${qa(d.image)}" alt=""><div class="map-overlay">${mk}</div></div></div>`}
function cardsHTML(d){
  if(!d)return '';
  return `<div class="lgrid" style="--cols:${d.cols||2}">${(d.cards||[]).map(c=>`<a class="lcard${c.wide?' wide':''}" ${ha(c.link)}>${c.img?`<img data-src="${qa(c.img)}" alt="">`:''}<div class="lg"></div>${c.tag?`<div class="ltag">${esc(c.tag)}</div>`:''}<div class="lc"><div class="lt">${esc(c.title||'')}</div><div class="ld">${esc(c.desc||'')}</div></div></a>`).join('')}</div>`}

const rm=async p=>{const [d,n]=await getDir(p);await d.removeEntry(n)};
const up=async(dir,file)=>{const ext=(file.name.match(/\.\w+$/)||['.png'])[0].toLowerCase(),n=slug(file.name.replace(/\.\w+$/,''))+ext;await writeFile(`${dir}/${n}`,file);return `${dir}/${n}`};
const pick=(multi,cb)=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=!!multi;i.onchange=()=>i.files.length&&cb([...i.files]);i.click()};
const clone=o=>JSON.parse(JSON.stringify(o));
async function saveData(kind,name,D){
  const store=kind==='maps'?S.map:S.grid,key=kind==='maps'?'maps':'grids';
  await writeFile(`${kind}/${slug(name)}.json`,JSON.stringify(D,null,1));
  store[slug(name)]=clone(D);S.m[key]=[...new Set([...(S.m[key]||[]),name])];await saveM()}
async function bulk(files,items,dir,set){
  let n=0;
  for(const f of files){const key=slug(f.name.replace(/\.\w+$/,'')),it=items.find(x=>x._o===f.name||slug(x.label||x.title||'')===key);
    if(it){set(it,await up(dir,f));delete it._o;n++}}
  return n}

function importMap(html){
  const doc=new DOMParser().parseFromString(html,'text/html'),types={},markers=[];
  doc.querySelectorAll('.map-marker').forEach(a=>{
    const st=a.getAttribute('style')||'',g=r=>(st.match(r)||[])[1];
    const y=parseFloat(g(/top:\s*([\d.]+)%/)),x=parseFloat(g(/left:\s*([\d.]+)%/));
    if(isNaN(x)||isNaN(y))return;
    const label=(a.querySelector('span')?.textContent||'').trim(),id=slug(label)||'repere';
    types[id]??={id,label,color:g(/--marker-bg:\s*(#[0-9a-fA-F]{6})/)||'#f59c0a',icon:'',_o:bn(g(/--marker-icon:\s*url\(['"]?([^'")]+)/)),link:stripSlash(a.getAttribute('href'))};
    markers.push({t:id,x,y,label:'',link:''})});
  return {_o:bn(doc.querySelector('.map-image')?.getAttribute('src')),types:Object.values(types),markers}}
function importCards(html){
  const doc=new DOMParser().parseFromString(html,'text/html'),tx=(a,s)=>(a.querySelector(s)?.textContent||'').trim();
  return [...doc.querySelectorAll('a.location-card')].map(a=>({title:tx(a,'.location-button-title'),desc:tx(a,'.location-button-description'),img:'',_o:bn(a.querySelector('img')?.getAttribute('src')),link:stripSlash(a.getAttribute('href')),tag:tx(a,'.location-button-tag'),wide:a.classList.contains('location-card-wide')}))}

function mapTab(sel=''){
  const names=S.m.maps||[],f=id=>$('#'+id);
  let D={image:'',size:26,types:[],markers:[]},cur=-1,act='',drag=-1;
  $('#ed').innerHTML=`<label>Carte</label><select id="ms"><option value="">➕ Nouvelle carte</option>${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select> <button id="mi">📥 Importer un HTML existant</button>
  <div id="imp" hidden><textarea id="it" rows="6" placeholder="Colle ici le HTML de ta carte (les balises map-marker)"></textarea><button class="pri" id="iok">Importer</button></div>
  <div class="ed"><div>
    <label>Nom — dans une page, écris [map:Nom] sur une ligne seule</label><input id="mn">
    <label>Image de la carte</label><button id="mim">Choisir l’image…</button> <small id="mip"></small>
    <label>Taille des repères (px)</label><input id="msz" type="number" min="10" max="80" value="26">
    <label>Types de repères — coche celui à placer, puis clique sur la carte</label><div id="tl"></div><button id="ta">➕ Type</button> <button id="tb">Associer des images en lot…</button>
    <label>Repère sélectionné — glisse-le pour le déplacer</label><div id="sp"></div>
    <p><button class="pri" id="msv">Enregistrer</button> <button id="mdel">Supprimer la carte</button><span id="msg"></span></p>
  </div><div id="cvw"></div></div>`;
  const pos=e=>{const r=f('ov').getBoundingClientRect(),c=(v,a,b)=>Math.min(100,Math.max(0,Math.round((v-a)/b*1000)/10));return [c(e.clientX,r.left,r.width),c(e.clientY,r.top,r.height)]};
  function renderTypes(){
    f('tl').innerHTML=D.types.map((t,i)=>`<div class="trow"><input type="radio" name="at" value="${i}" ${t.id===act?'checked':''}><input data-k="label" data-i="${i}" value="${qa(t.label)}" size="12"><input type="color" data-k="color" data-i="${i}" value="${qa(t.color)}"><button data-ic="${i}" title="Icône">${t.icon?'🖼✓':'🖼'}</button><input data-k="link" data-i="${i}" value="${qa(t.link)}" placeholder="lien par défaut" size="12"><button data-x="${i}">✕</button></div>`).join('')||'<small>Aucun type : ajoutes-en un.</small>'}
  function renderCanvas(){
    f('cvw').innerHTML=D.image?`<div class="map-inner"><img class="map-image" data-src="${qa(D.image)}" alt=""><div class="map-overlay" id="ov" style="cursor:crosshair">${D.markers.map((m,i)=>{const t=D.types.find(x=>x.id===m.t)||{},c=t.color||'#888';
      return `<span class="map-marker${i===cur?' sel':''}" data-i="${i}" style="top:${m.y}%;left:${m.x}%;--mc:${c};--mg:${c}b3;width:${D.size}px;height:${D.size}px">${icon(t)}<i>${esc(m.label||t.label||'')}</i></span>`}).join('')}</div></div><p><small>${D.markers.length} repères</small></p>`:'<p>Choisis d’abord l’image de la carte.</p>';
    fixImgs(f('cvw'))}
  function renderSel(){
    const m=D.markers[cur];
    f('sp').innerHTML=m?`<input id="sl" placeholder="Nom (sinon celui du type)" value="${qa(m.label)}"><input id="sk" placeholder="Lien (sinon celui du type)" value="${qa(m.link)}"><select id="st">${D.types.map(t=>`<option value="${qa(t.id)}" ${t.id===m.t?'selected':''}>${esc(t.label)}</option>`).join('')}</select> <button id="sd">Supprimer ce repère</button>`:'<small>Clique un repère sur la carte.</small>';
    if(!m)return;
    f('sl').oninput=e=>m.label=e.target.value;f('sk').oninput=e=>m.link=e.target.value;
    f('st').onchange=e=>{m.t=e.target.value;renderCanvas()};
    f('sd').onclick=()=>{D.markers.splice(cur,1);cur=-1;renderCanvas();renderSel()}}
  const all=()=>{f('mn').value=f('mn').value;f('msz').value=D.size;f('mip').textContent=D.image;renderTypes();renderCanvas();renderSel()};
  function load(n){
    D=n?clone(S.map[slug(n)]||D):{image:'',size:26,types:[],markers:[]};D.types??=[];D.markers??=[];D.size??=26;
    f('mn').value=n;f('mn').readOnly=!!n;cur=-1;act=D.types[0]?.id||'';all()}
  f('ms').onchange=e=>load(e.target.value);
  f('mi').onclick=()=>f('imp').hidden=!f('imp').hidden;
  f('iok').onclick=()=>{
    const r=importMap(f('it').value);if(!r.markers.length)return alert('Aucun repère trouvé : colle le HTML qui contient les <a class="map-marker">.');
    if(D.markers.length&&!confirm('Remplacer les repères actuels ?'))return;
    D.types=r.types;D.markers=r.markers;D._o=r._o;D.image='';act=D.types[0]?.id||'';cur=-1;f('imp').hidden=true;all();
    alert(`${r.markers.length} repères et ${r.types.length} types importés.\nAjoute maintenant l’image de la carte et les icônes depuis ton ordinateur : « Associer des images en lot » les reconnaît par leur nom de fichier d’origine (${r._o||'?'}…).`)};
  f('mim').onclick=()=>pick(false,async([file])=>{D.image=await up('maps/images',file);delete D._o;f('mip').textContent=D.image;renderCanvas()});
  f('msz').oninput=e=>{D.size=+e.target.value||26;renderCanvas()};
  f('ta').onclick=()=>{const label=(prompt('Nom du type (ex. Dealer) :')||'').trim();if(!label)return;
    let id=slug(label)||'type',k=2;while(D.types.some(t=>t.id===id))id=slug(label)+'-'+k++;
    D.types.push({id,label,color:'#f59c0a',icon:'',link:''});act=id;renderTypes()};
  f('tb').onclick=()=>pick(true,async files=>{
    let n=await bulk(files,D.types,'maps/images',(t,p)=>t.icon=p);
    const mf=files.find(x=>D._o&&x.name===D._o);if(mf){D.image=await up('maps/images',mf);delete D._o;n++}
    alert(n+' image(s) associée(s).');all()});
  f('tl').oninput=e=>{const k=e.target.dataset.k;if(k){D.types[+e.target.dataset.i][k]=e.target.value;renderCanvas()}};
  f('tl').onchange=e=>{if(e.target.name==='at')act=D.types[+e.target.value].id};
  f('tl').onclick=e=>{
    const ic=e.target.dataset.ic,x=e.target.dataset.x;
    if(ic!==undefined)pick(false,async([file])=>{D.types[+ic].icon=await up('maps/images',file);renderTypes();renderCanvas()});
    if(x!==undefined&&confirm('Supprimer ce type et tous ses repères ?')){const id=D.types[+x].id;D.types.splice(+x,1);D.markers=D.markers.filter(m=>m.t!==id);cur=-1;act=D.types[0]?.id||'';all()}};
  const cv=f('cvw');
  cv.onpointerdown=e=>{const m=e.target.closest('.map-marker');if(!m)return;drag=+m.dataset.i;cur=drag;cv.setPointerCapture(e.pointerId);e.preventDefault()};
  cv.onpointermove=e=>{if(drag<0)return;const [x,y]=pos(e),m=D.markers[drag],el=cv.querySelector(`[data-i="${drag}"]`);m.x=x;m.y=y;el.style.left=x+'%';el.style.top=y+'%'};
  cv.onpointerup=()=>{if(drag>=0){drag=-1;renderCanvas();renderSel()}};
  cv.onclick=e=>{if(e.target.id!=='ov')return;if(!act)return alert('Ajoute d’abord un type de repère.');
    const [x,y]=pos(e);D.markers.push({t:act,x,y,label:'',link:''});cur=D.markers.length-1;renderCanvas();renderSel()};
  f('msv').onclick=async()=>{
    const n=f('mn').value.trim();if(!n)return alert('Donne un nom à la carte.');if(!D.image)return alert('Choisis l’image de la carte.');
    await saveData('maps',n,D);mapTab(n);say('Enregistré ✓')};
  f('mdel').onclick=async()=>{
    const n=f('mn').value.trim();if(!n||!(S.m.maps||[]).includes(n)||!confirm('Supprimer la carte '+n+' ?'))return;
    await rm(`maps/${slug(n)}.json`);delete S.map[slug(n)];S.m.maps=S.m.maps.filter(x=>x!==n);await saveM();mapTab()};
  if(sel){f('ms').value=sel;load(sel)}else all()}

function gridTab(sel=''){
  const names=S.m.grids||[],f=id=>$('#'+id);
  let D={cols:2,cards:[]},tm;
  $('#ed').innerHTML=`<label>Grille de cartes</label><select id="gs"><option value="">➕ Nouvelle grille</option>${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select> <button id="gi">📥 Importer un HTML existant</button>
  <div id="imp" hidden><textarea id="it" rows="6" placeholder="Colle ici le HTML de tes cartes (les balises a.location-card)"></textarea><button class="pri" id="iok">Importer</button></div>
  <div class="ed"><div>
    <label>Nom — dans une page, écris [cards:Nom] sur une ligne seule</label><input id="gn">
    <label>Colonnes</label><input id="gc" type="number" min="1" max="4" value="2">
    <p><button id="ga">➕ Carte</button> <button id="gb">Associer des images en lot…</button></p>
    <div id="cl"></div>
    <p><button class="pri" id="gsv">Enregistrer</button> <button id="gdel">Supprimer la grille</button><span id="msg"></span></p>
  </div><div><label>Aperçu</label><div class="pv" id="gp"></div></div></div>`;
  const prev=()=>{f('gp').innerHTML=cardsHTML(D);fixImgs(f('gp'))},prevD=()=>{clearTimeout(tm);tm=setTimeout(prev,250)};
  function list(){
    f('cl').innerHTML=D.cards.map((c,i)=>`<div class="crow" data-i="${i}"><input data-k="title" value="${qa(c.title)}" placeholder="Titre"><input data-k="desc" value="${qa(c.desc)}" placeholder="Description"><input data-k="link" value="${qa(c.link)}" placeholder="Lien (page)"><input data-k="tag" value="${qa(c.tag)}" placeholder="Étiquette" size="9"><label><input type="checkbox" data-k="wide" ${c.wide?'checked':''}> large</label><button data-a="img">${c.img?'🖼✓':'🖼'}</button><button data-a="up">↑</button><button data-a="dn">↓</button><button data-a="x">✕</button></div>`).join('')||'<small>Aucune carte.</small>';
    prev()}
  function load(n){
    D=n?clone(S.grid[slug(n)]||D):{cols:2,cards:[]};D.cards??=[];D.cols??=2;
    f('gn').value=n;f('gn').readOnly=!!n;f('gc').value=D.cols;list()}
  f('gs').onchange=e=>load(e.target.value);
  f('gi').onclick=()=>f('imp').hidden=!f('imp').hidden;
  f('iok').onclick=()=>{const r=importCards(f('it').value);if(!r.length)return alert('Aucune carte trouvée : colle le HTML qui contient les <a class="location-card">.');
    if(D.cards.length&&!confirm('Remplacer les cartes actuelles ?'))return;
    D.cards=r;f('imp').hidden=true;list();alert(`${r.length} cartes importées.\nUtilise « Associer des images en lot » pour ajouter leurs images : elles sont reconnues par le nom de fichier d’origine ou par le titre.`)};
  f('gc').oninput=e=>{D.cols=+e.target.value||2;prevD()};
  f('ga').onclick=()=>{D.cards.push({title:'',desc:'',img:'',link:'',tag:'',wide:false});list()};
  f('gb').onclick=()=>pick(true,async files=>{const n=await bulk(files,D.cards,'cards/images',(c,p)=>c.img=p);alert(n+' image(s) associée(s).');list()});
  f('cl').oninput=e=>{const k=e.target.dataset.k;if(!k)return;D.cards[+e.target.closest('.crow').dataset.i][k]=e.target.type==='checkbox'?e.target.checked:e.target.value;prevD()};
  f('cl').onclick=e=>{
    const a=e.target.dataset.a,row=e.target.closest('.crow');if(!a)return;const i=+row.dataset.i,c=D.cards;
    if(a==='x')c.splice(i,1);
    else if(a==='up'&&i>0)[c[i-1],c[i]]=[c[i],c[i-1]];
    else if(a==='dn'&&i<c.length-1)[c[i+1],c[i]]=[c[i],c[i+1]];
    else if(a==='img')return pick(false,async([file])=>{c[i].img=await up('cards/images',file);list()});
    list()};
  f('gsv').onclick=async()=>{const n=f('gn').value.trim();if(!n)return alert('Donne un nom à la grille.');
    await saveData('cards',n,D);gridTab(n);say('Enregistré ✓')};
  f('gdel').onclick=async()=>{const n=f('gn').value.trim();if(!n||!(S.m.grids||[]).includes(n)||!confirm('Supprimer la grille '+n+' ?'))return;
    await rm(`cards/${slug(n)}.json`);delete S.grid[slug(n)];S.m.grids=S.m.grids.filter(x=>x!==n);await saveM();gridTab()};
  if(sel){f('gs').value=sel;load(sel)}else list()}

/* ---------- Démarrage ---------- */
$('#open').onclick=async()=>{
  if(!window.showDirectoryPicker){alert('Utilise Chrome ou Edge sur ordinateur pour ouvrir un dossier.');return}
  try{S.dir=await showDirectoryPicker({mode:'readwrite'})}catch{return}
  S.cache={};S.ok=true;
  try{S.m=JSON.parse(await readText('wiki.json'))}catch{S.m={name:'Mon Wiki',pages:[],templates:[]}}
  await loadTpl();await loadCSS();route()};
$('#q').oninput=e=>{const v=e.target.value.trim();v.length>1?search(v):route()};
addEventListener('hashchange',route);addEventListener('popstate',route);
if(CLEAN){
  if(location.hash.startsWith('#/'))history.replaceState(null,'',location.hash.slice(1));
  new MutationObserver(()=>fixLinks(main)).observe(main,{childList:true,subtree:true});
  document.addEventListener('click',e=>{const a=e.target.closest('a[href^="/"]');
    if(!a||a.target==='_blank'||a.getAttribute('href').startsWith('//')||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
    e.preventDefault();history.pushState(null,'',a.getAttribute('href'));route();scrollTo(0,0)})}
$('#side').addEventListener('click',e=>{const a=e.target.closest('.sd');if(a)document.getElementById(a.dataset.h)?.scrollIntoView({behavior:'smooth'})});
addEventListener('scroll',()=>{if(!S.heads?.length)return;let cur=null;
  for(const h of S.heads){const el=document.getElementById(h.id);if(el&&el.getBoundingClientRect().top<90)cur=h.id}
  document.querySelectorAll('#side .sd').forEach(a=>a.classList.toggle('on',a.dataset.h===cur))},{passive:true});
main.addEventListener('click',e=>{const b=e.target.closest('.map-legend button');if(!b)return;b.classList.toggle('off');
  b.closest('.map-box').querySelectorAll('.map-marker').forEach(m=>{if(m.dataset.t===b.dataset.t)m.hidden=b.classList.contains('off')})});
$('#tools').hidden=!LOCAL;
async function loadTpl(){S.tpl={};S.map={};S.grid={};
  for(const n of S.m.maps||[]){try{S.map[slug(n)]=JSON.parse(await readText(`maps/${slug(n)}.json`))}catch{}}
  for(const n of S.m.grids||[]){try{S.grid[slug(n)]=JSON.parse(await readText(`cards/${slug(n)}.json`))}catch{}}
for(const n of S.m.templates||[]){try{S.tpl[slug(n)]=await readText(`templates/${slug(n)}.html`)}catch{}}}
async function loadCSS(){try{$('#custom').textContent=await readText('style.css')}catch{$('#custom').textContent=''}}
(async()=>{try{S.m=JSON.parse(await readText('wiki.json'));S.ok=true}catch{}await loadTpl();await loadCSS();route()})();
</script>
